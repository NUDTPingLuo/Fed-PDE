# Unified configuration for the first four publication-strengthening studies.
base_configs:
  antiderivative: config/config_antiderivative.yaml
  diffusion_reaction: config/config_diffusion_reaction.yaml
  burgers: config/config_burgers.yaml

common:
  n_rounds: 1000
  local_steps: 5
  seeds: [0, 1, 42, 999, 2026]
  round_checkpoints: [0, 1, 5, 10, 20, 50, 100, 200, 500, 1000]
  output_dir: results

formal:
  tasks: [antiderivative, diffusion_reaction, burgers]

clients:
  tasks: [antiderivative, diffusion_reaction, burgers]
  values: [20]

viscosity:
  task: burgers
  values: [0.1, 0.05, 0.01, 0.005]

# Adam remains the primary optimizer in the task YAML files.  The SGD ablation
# uses Nesterov momentum 0.9 and cosine decay from 0.01 to 0.001.
optimizer:
  tasks: [antiderivative, diffusion_reaction, burgers]
  values: [sgd]
  sgd_lr: 0.01
  sgd_min_lr: 0.001
  sgd_momentum: 0.9
  sgd_nesterov: true
