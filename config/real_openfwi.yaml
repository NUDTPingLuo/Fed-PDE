task: openfwi
dataset:
  type: openfwi
  dataset_name: OpenFWI CurveFault-B
  data_root: data/public/OpenFWI/CurveFault_B
  train_annotation: data/public/OpenFWI/curvefault_b_train.txt
  test_annotation: data/public/OpenFWI/curvefault_b_val.txt
  n_train: 2000
  n_test: 500
  time_stride: 4
  receiver_stride: 1
model: {type: inversionnet_lite, width: 24}
partition:
  n_bins: 10
  alpha_values: [10.0, 1.0, 0.1, 0.01]
  min_client_samples: 16
  clustering_seed: 42
  clustering_max_iter: 100
  partition_seed_base: 30000
federation: {n_clients: 10}
training: {device: auto, batch_size: 8, optimizer: adam, lr: 0.001, lr_schedule: cosine, min_lr: 0.0001, local_steps: 5, n_rounds: 1000}
evaluation: {seeds: [0, 1, 42, 999, 2026], round_checkpoints: [0, 1, 5, 10, 20, 50, 100, 200, 500, 1000]}
output: {dir: results/public/openfwi, prefix: openfwi_curvefault_b_k10_s5_r1000}
