# Paper-scale antiderivative dataset and architecture (Sec. 6.2/Table 4).
experiment_profile: paper_scale
task: antiderivative
data: {n_sensors: 100, output_grid: 100, n_modes: 10, condition_scale: 1.0}
physics: {}
benchmark:
  n_bins: 10
  sampling_pool_size: 1000
  alpha_values: [10.0, 1.0, 0.1, 0.01]
  transport_samples: 100
  partition: {min_client_samples: 16}
model: {width: 40, depth: 2, activation: relu}
federation: {n_clients: 10}
training: {backend: torch, device: auto, batch_size: 16, mixed_precision: false, optimizer: adam, lr: 0.001, lr_schedule: cosine, min_lr: 0.0001, local_steps: 5, n_rounds: 1000}
evaluation: {seeds: [0, 1, 42, 999, 2026], n_test: 1000}
seed_base: 42
output: {dir: results/manual/antiderivative, prefix: paper_antiderivative_deeponet}
